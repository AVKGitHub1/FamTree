[project]
name = "famtree"
version = "1.0.0"
description = "Self-hosted, encrypted, privacy-aware family tree"
requires-python = ">=3.13"

[project.scripts]
famtree = "famtree.server:main"
famtree-admin = "famtree.cli:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
